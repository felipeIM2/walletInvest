<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proventos - WalletInvest</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Proventos</h1>
      <button id="btnVoltar" class="btn-voltar">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
    </header>

    <div class="filtros">
      <select id="filtroStatus">
        <option value="todos">Todos</option>
        <option value="Aguardando">Aguardando</option>
        <option value="Pago">Pagos</option>
      </select>
      <select id="filtroTipo">
        <option value="todos">Todos os Tipos</option>
        <option value="Dividendo">Dividendos</option>
        <option value="JCP">JCP</option>
        <option value="Rendimento">Rendimentos</option>
        <option value="Bonificação">Bonificações</option>
      </select>
      <input type="month" id="filtroMes">
    </div>

    <div class="resumo">
      <div class="card">
        <h3>Total Recebido</h3>
        <p id="totalRecebido">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>A Receber</h3>
        <p id="totalReceber">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Média Mensal</h3>
        <p id="mediaMensal">R$ 0,00</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Tipo</th>
          <th>Data Base</th>
          <th>Data Pagamento</th>
          <th>Valor por Ação</th>
          <th>Quantidade</th>
          <th>Valor Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabelaProventos">
      </tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="../carteira/config-frontend.js"></script>
  <script src="./script.js"></script>
</body>
</html>
