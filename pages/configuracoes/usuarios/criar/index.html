<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Usuário - WalletInvest</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../../../../notifications.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <button id="btnVoltar" class="btn-voltar">
        <i class="fas fa-arrow-left"></i> Voltar
      </button>
      <h1><i class="fas fa-user-plus"></i> Criar Novo Usuário</h1>
    </header>
    
    <div class="form-container">
      <form id="formCriarUsuario">
        <div class="input-group">
          <label for="login"><i class="fas fa-user"></i> Login/Email:</label>
          <input type="text" id="login" name="login" placeholder="Digite o login ou email do usuário" required>
        </div>
        
        <div class="input-group">
          <label for="senha"><i class="fas fa-lock"></i> Senha:</label>
          <input type="password" id="senha" name="senha" placeholder="Digite a senha do usuário" required>
        </div>
        
        <div class="button-group">
          <button type="button" id="btnCancelar" class="btn-cancelar">
            <i class="fas fa-times"></i> Cancelar
          </button>
          <button type="submit" id="btnCriar" class="btn-criar">
            <i class="fas fa-user-plus"></i> 
            <span class="btn-text">Criar Usuário</span>
            <span class="loading" style="display: none;">
              <i class="fas fa-spinner fa-spin"></i> Criando...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../../../../notifications.js"></script>
  <script src="../../../../config-frontend.js?v=2"></script>
  <script src="./script.js"></script>
</body>
</html>
